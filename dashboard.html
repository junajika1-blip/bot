<!DOCTYPE html>
<html lang="id" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>CREATED; IYANN</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* TEMA MODERN CYBER / SCI-FI */
            --bg-void: #05070a; /* Hideung poék angkasa */
            --bg-panel: rgba(10, 15, 25, 0.85); /* Panel transparan kaca poék */
            
            --cyber-cyan: #00f0ff; /* Biru neon futuristik */
            --cyber-cyan-dim: rgba(0, 240, 255, 0.2);
            --cyber-orange: #ff3c00; /* Oranye/Beureum neon jang aktivasi */
            --cyber-orange-dim: rgba(255, 60, 0, 0.2);
            
            --hacker-green: #00ff41; /* Tetep make hejo jang terminal log */
            
            --text-main: #e2e8f0; 
            --text-muted: #64748b;
            
            --transition: 0.3s ease; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Chakra Petch', sans-serif; }
        
        body { 
            background-color: var(--bg-void); 
            color: var(--text-main); 
            line-height: 1.5; 
            padding: 15px;
            /* Latar Grid Hologram */
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            background-position: center center;
        }

        /* MATRIX CANVAS BACKGROUND */
        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1; /* Posisina di tukangeun kabéh elemen */
            opacity: 0.15; /* Transparan 15% ngarah teu ngaganggu UI hareup */
            pointer-events: none; /* Teu bisa di-klik */
        }

        .container { max-width: 600px; margin: 0 auto; position: relative; }

        /* HEADER TYPEWRITER SCI-FI */
        .header { 
            padding-bottom: 10px; 
            border-bottom: 1px solid var(--cyber-cyan-dim); 
            margin-bottom: 25px; 
            display: flex;
            align-items: center;
            min-height: 45px;
            position: relative;
        }
        
        .header::after {
            content: ''; position: absolute; bottom: -2px; left: 0; width: 30%; height: 3px; background: var(--cyber-cyan); box-shadow: 0 0 10px var(--cyber-cyan);
        }
        
        .typewriter-text { font-size: 18px; font-weight: 700; color: var(--cyber-cyan); font-family: 'Fira Code', monospace; letter-spacing: 1px; text-transform: uppercase; text-shadow: 0 0 8px var(--cyber-cyan-dim); }
        .cursor { font-size: 18px; font-weight: bold; color: var(--cyber-cyan); animation: blink 0.8s step-end infinite; margin-left: 5px; }
        @keyframes blink { 50% { opacity: 0; } }

        /* TABS (GAYA HUD FUTURISTIK) */
        .tabs { display: flex; gap: 15px; margin-bottom: 25px; }
        .tab-btn { 
            flex: 1; padding: 12px; background: transparent; 
            border: 1px solid var(--text-muted); color: var(--text-muted); 
            font-size: 14px; font-weight: 600; cursor: pointer; transition: var(--transition); 
            text-transform: uppercase; letter-spacing: 1px;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }
        .tab-btn:hover { border-color: var(--text-main); color: var(--text-main); }
        .tab-btn.active[data-tab="0"] { background: var(--cyber-cyan-dim); color: var(--cyber-cyan); border-color: var(--cyber-cyan); box-shadow: inset 0 0 10px var(--cyber-cyan-dim); }
        .tab-btn.active[data-tab="1"] { background: var(--cyber-orange-dim); color: var(--cyber-orange); border-color: var(--cyber-orange); box-shadow: inset 0 0 10px var(--cyber-orange-dim); }

        /* PANEL */
        .panel { display: none; }
        .panel.active { display: block; animation: hudFadeIn 0.4s ease-out forwards; }
        @keyframes hudFadeIn { from { opacity: 0; transform: scale(0.98) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }

        /* KARTU FORM (GAYA SCI-FI PANEL) */
        .card { 
            background: var(--bg-panel); border: 1px solid var(--cyber-cyan-dim); 
            padding: 25px; position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
        }
        /* Sudut-sudut panel (crosshair) */
        .card::before, .card::after { content: ''; position: absolute; width: 15px; height: 15px; border: 2px solid transparent; pointer-events: none; }
        .card::before { top: -1px; left: -1px; border-top-color: var(--cyber-cyan); border-left-color: var(--cyber-cyan); }
        .card::after { bottom: -1px; right: -1px; border-bottom-color: var(--cyber-cyan); border-right-color: var(--cyber-cyan); }
        
        .panel[id="panel1"] .card { border-color: var(--cyber-orange-dim); }
        .panel[id="panel1"] .card::before { border-top-color: var(--cyber-orange); border-left-color: var(--cyber-orange); }
        .panel[id="panel1"] .card::after { border-bottom-color: var(--cyber-orange); border-right-color: var(--cyber-orange); }

        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 8px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        
        /* INPUT GAYA TERMINAL */
        .form-control { 
            width: 100%; padding: 12px 15px; background: rgba(0,0,0,0.5); 
            border: 1px solid var(--border-color); border-left: 3px solid var(--text-muted);
            color: #ffffff; font-size: 15px; transition: var(--transition); 
            font-family: 'Fira Code', monospace;
        }
        .form-control:focus { outline: none; border-color: var(--cyber-cyan); border-left: 3px solid var(--cyber-cyan); box-shadow: 0 0 15px var(--cyber-cyan-dim); background: rgba(0, 240, 255, 0.05); }
        .panel[id="panel1"] .form-control:focus { border-color: var(--cyber-orange); border-left-color: var(--cyber-orange); box-shadow: 0 0 15px var(--cyber-orange-dim); background: rgba(255, 60, 0, 0.05); }
        
        /* PERBAIKAN DROPDOWN (SANGKAN TEU BODAS) */
        select.form-control { 
            appearance: auto; 
            cursor: pointer; 
            color-scheme: dark; /* Maksa browser ngaluarkeun dropdown tema poék */
        }
        
        select.form-control option {
            background-color: var(--bg-void); /* Warna kasang tukang poék */
            color: var(--cyber-cyan); /* Warna tulisan neon biru */
            font-family: 'Fira Code', monospace;
            font-weight: 600;
            padding: 10px;
        }

        /* Husus keur tab Aktivasi, tulisan dropdown-na jadi oranye */
        .panel[id="panel1"] select.form-control option {
            color: var(--cyber-orange);
        }

        /* TOMBOL NEON */
        .btn { 
            width: 100%; padding: 14px; background: transparent; border: 1px solid; 
            font-size: 15px; font-weight: 700; color: #ffffff; cursor: pointer; transition: var(--transition); 
            text-transform: uppercase; letter-spacing: 2px;
            display: flex; align-items: center; justify-content: center; margin-top: 10px;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .btn-blue { border-color: var(--cyber-cyan); color: var(--cyber-cyan); }
        .btn-blue:hover:not(:disabled) { background: var(--cyber-cyan); color: #000; box-shadow: 0 0 20px var(--cyber-cyan); }
        
        .btn-orange { border-color: var(--cyber-orange); color: var(--cyber-orange); }
        .btn-orange:hover:not(:disabled) { background: var(--cyber-orange); color: #000; box-shadow: 0 0 20px var(--cyber-orange); }

        /* ==========================================
           TERMINAL SCANNER HACKER
        ========================================== */
        .scanner-box {
            display: none; background: #000000; border: 1px solid #113311;
            margin-top: 25px; position: relative; overflow: hidden; padding: 15px;
            box-shadow: inset 0 0 30px rgba(0,255,65,0.1);
        }
        .scanner-box.show { display: block; animation: expandScanner 0.4s cubic-bezier(0.1, 1, 0.3, 1); }
        @keyframes expandScanner { from { max-height: 0; opacity: 0; } to { max-height: 250px; opacity: 1; } }

        .scan-laser {
            position: absolute; top: 0; left: 0; height: 2px; width: 100%;
            background: var(--hacker-green); box-shadow: 0 0 15px var(--hacker-green), 0 0 30px var(--hacker-green);
            animation: scanRadar 2s ease-in-out infinite alternate; opacity: 0.8; z-index: 2;
        }
        @keyframes scanRadar { 0% { top: 0%; opacity: 0.2;} 50% { opacity: 1; } 100% { top: 100%; opacity: 0.2; } }

        .terminal-logs {
            font-family: 'Fira Code', monospace; font-size: 12px; font-weight: 500;
            color: #006611; line-height: 1.8; min-height: 100px; z-index: 1; position: relative;
        }
        .log-line { display: block; opacity: 0.6; }
        .log-line.active { color: var(--hacker-green); opacity: 1; text-shadow: 0 0 8px rgba(0, 255, 65, 0.8); }
        .log-cursor { display: inline-block; width: 8px; height: 14px; background: var(--hacker-green); box-shadow: 0 0 8px var(--hacker-green); margin-left: 6px; vertical-align: middle; animation: blink 1s step-end infinite; }
        .log-queue { color: var(--cyber-orange); text-shadow: 0 0 8px var(--cyber-orange); }

        /* HASIL DATA (HUD GRID) */
        .result-box { margin-top: 25px; padding-top: 25px; border-top: 1px dashed var(--cyber-cyan-dim); display: none; }
        .panel[id="panel1"] .result-box { border-top-color: var(--cyber-orange-dim); }
        .result-box.show { display: block; animation: fadeIn 0.4s; }
        
        .status-banner { 
            padding: 12px; font-weight: 700; font-size: 14px; margin-bottom: 15px; 
            text-transform: uppercase; letter-spacing: 1px;
            background: rgba(0, 240, 255, 0.1); border-left: 4px solid var(--cyber-cyan); color: var(--cyber-cyan); 
        }
        .status-banner.success-orange { background: rgba(255, 60, 0, 0.1); border-left-color: var(--cyber-orange); color: var(--cyber-orange); }
        .status-banner.error { background: rgba(255, 0, 0, 0.1); border-left-color: #ff0000; color: #ff0000; }

        .data-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .data-item { background: rgba(0,0,0,0.4); border: 1px solid var(--border-color); padding: 12px; }
        .data-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 1px; }
        .data-value { font-family: 'Fira Code', monospace; font-size: 13px; color: #ffffff; word-break: break-all; }
        .value-cyan { color: var(--cyber-cyan); text-shadow: 0 0 5px var(--cyber-cyan-dim); }
        .value-orange { color: var(--cyber-orange); text-shadow: 0 0 5px var(--cyber-orange-dim); }
        .value-red { color: #ff0000; }

    </style>
</head>
<body>

    <!-- MATRIX BACKGROUND CANVAS -->
    <canvas id="matrixCanvas"></canvas>

    <div class="container">
        <!-- HEADER TYPEWRITER -->
        <div class="header">
            <div>
                <span id="typewriterText" class="typewriter-text"></span><span class="cursor">_</span>
            </div>
        </div>

        <!-- TABS NAV -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="0">Parios Redaman</button>
            <button class="tab-btn" data-tab="1">Aktipkeun Isolir</button>
        </div>

        <!-- TAB 0: CEK REDAMAN -->
        <div class="panel active" id="panel0">
            <div class="card">
                <form id="formCek">
                    <div class="form-group">
                        <label class="form-label">Pilih Server OLT</label>
                        <select class="form-control" id="serverCek" required>
                            <option value="">-- PILIH SERVER --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Username Pelanggan</label>
                        <input type="text" class="form-control" id="usernameCek" placeholder="ASEUPKEUN WAN" required autocomplete="off">
                    </div>
                    <button type="submit" class="btn btn-blue" id="btnCek">MULAI PARIOS</button>
                </form>

                <!-- TERMINAL SCANNER (CEK) -->
                <div class="scanner-box" id="scannerCek">
                    <div class="scan-laser"></div>
                    <div class="terminal-logs" id="logCek"></div>
                </div>
                
                <!-- HASIL -->
                <div id="resultCek" class="result-box"></div>
            </div>
        </div>

        <!-- TAB 1: AKTIVASI -->
        <div class="panel" id="panel1">
            <div class="card">
                <form id="formAktivasi">
                    <div class="form-group">
                        <label class="form-label">Pilih Server Mikrotik</label>
                        <select class="form-control" id="serverAktivasi" required>
                            <option value="">-- PILIH SERVER --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Username Pelanggan</label>
                        <input type="text" class="form-control" id="usernameAktivasi" placeholder="ASEUPKEUN WAN" required autocomplete="off">
                    </div>
                    <button type="submit" class="btn btn-orange" id="btnAktivasi">JALANKEUN AKTIVASI</button>
                </form>

                <!-- TERMINAL SCANNER (AKTIVASI) -->
                <div class="scanner-box" id="scannerAktivasi">
                    <div class="scan-laser"></div>
                    <div class="terminal-logs" id="logAktivasi"></div>
                </div>
                
                <!-- HASIL -->
                <div id="resultAktivasi" class="result-box"></div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // MATRIX RAIN BACKGROUND ANIMATION
        // ==========================================
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Karakter Matrix nu turun
        const chars = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレゲゼデベペオォコソトノホモヨョロゴゾドボポヴッンABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        const fontSize = 14;
        let columns = canvas.width / fontSize;
        let drops = [];

        for (let x = 0; x < columns; x++) drops[x] = 1;

        function drawMatrix() {
            ctx.fillStyle = 'rgba(5, 7, 10, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ff41'; // Warna hejo hacker
            ctx.font = fontSize + 'px "Fira Code", monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);

        // ==========================================
        // SISA SCRIPT UI APLIKASI
        // ==========================================
        
        // 1. ANIMASI HEADER TYPEWRITER (Ngetik)
        const textToType = "[SYS] Parios Redaman & Aktivasi Isolir";
        const typeTarget = document.getElementById("typewriterText");
        let typeIndex = 0;

        function typeWriter() {
            if (typeIndex < textToType.length) {
                typeTarget.innerHTML += textToType.charAt(typeIndex);
                typeIndex++;
                setTimeout(typeWriter, 80); // Laju kacepetan ngetik
            } else {
                setTimeout(() => { typeTarget.innerHTML = ''; typeIndex = 0; typeWriter(); }, 10000); 
            }
        }
        setTimeout(typeWriter, 500);

        // 2. TABS SWITCHING
        const tabBtns = document.querySelectorAll('.tab-btn');
        const panels = document.querySelectorAll('.panel');
        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const target = btn.getAttribute('data-tab');
                tabBtns.forEach(b => b.classList.remove('active'));
                panels.forEach(p => p.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(`panel${target}`).classList.add('active');
            });
        });

        // 3. LOAD SERVERS
        async function loadServers() {
            try {
                const res = await fetch('/api/servers');
                const data = await res.json();
                const selCek = document.getElementById('serverCek');
                const selAkt = document.getElementById('serverAktivasi');
                data.servers.forEach(srv => {
                    selCek.add(new Option(srv.label, srv.key));
                    selAkt.add(new Option(srv.label, srv.key));
                });
            } catch (err) {}
        }

        // 4. FUNGSI TERMINAL LOG HACKER
        let logIntervals = {};
        
        const dummyLogsCek = [
            "Nyambungkeun ka port optik...",
            "Meunangkeun otoritas server...",
            "Nge-ping ka node OLT utama...",
            "Maca status antarmuka ONU...",
            "Ngitung kaluaran daya laser...",
            "Verifikasi data redaman (dBm)...",
            "Ekstrak hasil akhir..."
        ];

        const dummyLogsAkt = [
            "Bypass protokol kaamanan API...",
            "Ngaksés database Mikrotik...",
            "Milarian profil PPPoE...",
            "Ngahapus rule address-list isolir...",
            "Restart interface klien...",
            "Sistem online... Verifikasi rute...",
            "Aktivasi direngsekeun..."
        ];

        function startScanner(target, isAktivasi) {
            const scannerBox = document.getElementById(`scanner${target}`);
            const logBox = document.getElementById(`log${target}`);
            scannerBox.classList.add('show');
            logBox.innerHTML = '';
            
            const logsArray = isAktivasi ? dummyLogsAkt : dummyLogsCek;
            let step = 0;

            printLogLine(logBox, "> ROOT ACCESS GRANTED...");
            setTimeout(() => { printLogLine(logBox, "> Ngamimitian runtuyan eksekusi..."); }, 300);

            logIntervals[target] = setInterval(() => {
                if (step < logsArray.length) {
                    printLogLine(logBox, `> ${logsArray[step]}`);
                    step++;
                }
            }, 600); // Laju terminal pas proses
        }

        function printLogLine(container, text, isQueue = false) {
            const prevLines = container.querySelectorAll('.log-line');
            prevLines.forEach(line => {
                line.classList.remove('active');
                const cursor = line.querySelector('.log-cursor');
                if(cursor) cursor.remove();
            });

            if(prevLines.length > 4) prevLines[0].remove();

            const div = document.createElement('div');
            div.className = `log-line active ${isQueue ? 'log-queue' : ''}`;
            div.innerHTML = `${text}<span class="log-cursor"></span>`;
            container.appendChild(div);
        }

        function setQueueLog(target, position, wait) {
            const logBox = document.getElementById(`log${target}`);
            printLogLine(logBox, `[SISTEM PINUH] Nungguan giliran #${position}... Antos ${wait}s`, true);
        }

        function stopScanner(target) {
            if (logIntervals[target]) clearInterval(logIntervals[target]);
            document.getElementById(`scanner${target}`).classList.remove('show');
        }

        // 5. OLT PARSER & BUILDER (HUD Grid)
        function parseOLTResult(oltText) {
            if(!oltText) return { oltName: 'TEU KANYAHOAN', redaman: 'N/A', status: 'TEU KANYAHOAN' };
            const lines = oltText.split('\n').filter(line => line.trim());
            const oltName = lines[0]?.replace(/[✅*]/g, '').trim() || 'OLT';
            const redaman = lines[1]?.match(/Redaman:\s*\*?([^\*]*)\*?/)?.[1].trim() || 'N/A';
            const status = lines[2]?.match(/Status:\s*(.*)/)?.[1].trim() || 'TEU KANYAHOAN';
            return { oltName, redaman, status };
        }

        function buildDashboardResult(data, isAktivasi) {
            let html = '';
            let bannerClass = isAktivasi ? 'success-orange' : '';
            html += `<div class="status-banner ${bannerClass}">[✓] PROSES RENGSE</div>`;

            html += `<div class="data-grid">`;
            html += `<div class="data-item"><div class="data-label">USERNAME</div><div class="data-value">${data.username || '-'}</div></div>`;
            html += `<div class="data-item"><div class="data-label">SERVER</div><div class="data-value">${data.server || '-'}</div></div>`;
            if(data.ip) html += `<div class="data-item"><div class="data-label">IP ADDRESS</div><div class="data-value">${data.ip}</div></div>`;
            if(data.mac) html += `<div class="data-item"><div class="data-label">MAC ADDRESS</div><div class="data-value">${data.mac}</div></div>`;
            if(data.paket) html += `<div class="data-item"><div class="data-label">PROFIL / PAKET</div><div class="data-value">${data.paket}</div></div>`;

            if (data.olt && data.olt !== 'ONU tidak ditemukan di OLT manapun') {
                const olt = parseOLTResult(data.olt);
                let rxColor = (olt.redaman.includes('-') && parseFloat(olt.redaman) < -25) ? 'value-red' : 'value-cyan';
                html += `<div class="data-item" style="grid-column: 1 / -1;"><div class="data-label">NGARAN OLT NODE</div><div class="data-value">${olt.oltName}</div></div>`;
                html += `<div class="data-item"><div class="data-label">REDAMAN (RX)</div><div class="data-value ${rxColor}">${olt.redaman}</div></div>`;
                html += `<div class="data-item"><div class="data-label">STATUS ONU</div><div class="data-value">${olt.status}</div></div>`;
            } else if (data.olt) {
                html += `<div class="data-item" style="grid-column: 1 / -1; border-color:var(--cyber-orange);"><div class="data-label">STATUS OLT</div><div class="data-value value-red">ONU TEU KAPENDAK</div></div>`;
            }
            html += `</div>`;
            return html;
        }

        function renderError(targetDiv, errMsg) {
            targetDiv.innerHTML = `<div class="status-banner error">[✗] GAGAL: ${errMsg}</div>`;
            targetDiv.classList.add('show');
        }

        // 6. CORE PROCESS
        let queuePollingInterval;

        async function processScan(action, serverKey, username) {
            const isAktivasi = action === 'aktivasi';
            const targetName = isAktivasi ? 'Aktivasi' : 'Cek';
            const resultDiv = document.getElementById(`result${targetName}`);
            const btn = document.getElementById(`btn${targetName}`);
            const endpoint = isAktivasi ? '/api/aktivasi' : '/api/cek-redaman';
            const btnOriginalText = isAktivasi ? 'JALANKEUN AKTIVASI' : 'MULAI PARIOS';

            resultDiv.classList.remove('show');
            resultDiv.innerHTML = '';
            btn.disabled = true;
            btn.innerHTML = 'NUJU EKSEKUSI...';
            
            startScanner(targetName, isAktivasi);

            try {
                const res = await fetch(endpoint, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ serverKey, username }) 
                });
                const data = await res.json();
                
                if (data.queued) {
                    setQueueLog(targetName, data.position, data.estimatedWait);
                    pollForResult(data.queueId, targetName, resultDiv, isAktivasi, btn, btnOriginalText);
                    return;
                }
                
                stopScanner(targetName);
                btn.disabled = false;
                btn.innerHTML = btnOriginalText;
                
                if (data.success) {
                    resultDiv.innerHTML = buildDashboardResult(data.data, isAktivasi);
                    resultDiv.classList.add('show');
                } else {
                    renderError(resultDiv, data.error || 'Eksekusi gagal diprosés.');
                }
            } catch (err) {
                stopScanner(targetName);
                btn.disabled = false;
                btn.innerHTML = btnOriginalText;
                renderError(resultDiv, err.message);
            }
        }

        // 7. POLLING
        async function pollForResult(queueId, targetName, resultDiv, isAktivasi, btn, btnOriginalText) {
            queuePollingInterval = setInterval(async () => {
                try {
                    const res = await fetch(`/api/queue-result/${queueId}`);
                    const data = await res.json();
                    
                    if (data.status === 'done') {
                        clearInterval(queuePollingInterval); queuePollingInterval = null; 
                        stopScanner(targetName);
                        btn.disabled = false;
                        btn.innerHTML = btnOriginalText;
                        
                        resultDiv.innerHTML = buildDashboardResult(data.data, isAktivasi);
                        resultDiv.classList.add('show');
                        
                    } else if (data.status === 'error') {
                        clearInterval(queuePollingInterval); queuePollingInterval = null; 
                        stopScanner(targetName);
                        btn.disabled = false;
                        btn.innerHTML = btnOriginalText;
                        
                        renderError(resultDiv, data.error);
                    }
                } catch (err) {}
            }, 2000);
        }

        // 8. TRIGGERS
        document.getElementById('formCek').addEventListener('submit', async (e) => {
            e.preventDefault();
            await processScan('cek', document.getElementById('serverCek').value, document.getElementById('usernameCek').value.trim());
        });

        document.getElementById('formAktivasi').addEventListener('submit', async (e) => {
            e.preventDefault();
            await processScan('aktivasi', document.getElementById('serverAktivasi').value, document.getElementById('usernameAktivasi').value.trim());
        });

        loadServers();
    </script>
</body>
</html>
