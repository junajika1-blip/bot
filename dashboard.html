<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RnBNET - Cek Redaman & Aktivasi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 40px; animation: fadeInDown 0.8s ease; }
        .header h1 { font-size: 32px; font-weight: 700; margin-bottom: 10px; text-shadow: 0 2px 10px rgba(0,0,0,0.2); }
        .header p { font-size: 16px; opacity: 0.9; }
        .cards-wrapper { display: grid; grid-template-columns: repeat(auto-fit, minmax(500px, 1fr)); gap: 30px; margin-bottom: 30px; }
        .card { background: rgba(255, 255, 255, 0.95); border-radius: 20px; padding: 35px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); backdrop-filter: blur(10px); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); animation: fadeInUp 0.8s ease; }
        .card:hover { transform: translateY(-10px); box-shadow: 0 30px 80px rgba(0,0,0,0.4); }
        .card-icon { width: 60px; height: 60px; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 20px; animation: pulse 2s infinite; }
        .card-cek .card-icon { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .card-aktivasi .card-icon { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .card h2 { font-size: 24px; margin-bottom: 25px; color: #333; font-weight: 700; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; font-size: 14px; }
        .form-group select, .form-group input { width: 100%; padding: 14px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 15px; transition: all 0.3s ease; background: #f8f9fa; }
        .form-group select:focus, .form-group input:focus { outline: none; border-color: #667eea; background: white; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
        .btn { width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4); }
        .btn-primary:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5); }
        .btn-secondary { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; box-shadow: 0 10px 30px rgba(245, 87, 108, 0.4); }
        .btn-secondary:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(245, 87, 108, 0.5); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; }
        .result { margin-top: 25px; padding: 25px; border-radius: 15px; display: none; animation: slideIn 0.5s ease; }
        .result.show { display: block; }
        .result.success { background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%); border: 2px solid #28a745; color: #155724; }
        .result.error { background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%); border: 2px solid #dc3545; color: #721c24; }
        .result h3 { margin-bottom: 20px; font-size: 20px; font-weight: 700; }
        .result-item { margin-bottom: 12px; display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(0,0,0,0.1); animation: fadeIn 0.5s ease; }
        .result-item:last-child { border-bottom: none; }
        .result-label { font-weight: 600; color: #555; min-width: 120px; }
        .result-value { color: #333; flex: 1; word-break: break-all; }
        .olt-result { margin-top: 20px; padding: 20px; background: white; border-radius: 12px; border-left: 4px solid #28a745; animation: slideInLeft 0.6s ease; }
        .olt-result h4 { color: #28a745; margin-bottom: 15px; font-size: 18px; }
        .queue-notification { position: fixed; top: 20px; right: 20px; background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; padding: 20px 25px; border-radius: 12px; box-shadow: 0 10px 30px rgba(245, 87, 108, 0.4); z-index: 1000; max-width: 350px; animation: slideInRight 0.5s ease; }
        .queue-notification h4 { font-size: 16px; margin-bottom: 8px; font-weight: 700; }
        .queue-notification p { font-size: 14px; opacity: 0.95; line-height: 1.5; }
        .loading { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: white; animation: spin 1s ease-in-out infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideInLeft { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(400px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes slideOutRight { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(400px); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        @media (max-width: 768px) { .cards-wrapper { grid-template-columns: 1fr; } .header h1 { font-size: 24px; } .card { padding: 25px; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Cek Redaman OLT & Aktivasi Pelanggan</h1>
            <p>RnBNET Network Management System</p>
        </div>
        
        <div class="cards-wrapper">
            <div class="card card-cek">
                <div class="card-icon"></div>
                <h2>Cek Redaman</h2>
                <form id="formCek">
                    <div class="form-group">
                        <label>Pilih Server</label>
                        <select id="serverCek" required><option value="">-- Pilih Server --</option></select>
                    </div>
                    <div class="form-group">
                        <label>Username Pelanggan</label>
                        <input type="text" id="usernameCek" placeholder="Contoh: liacahyani" required>
                    </div>
                    <button type="submit" class="btn btn-primary" id="btnCek"><span>🔍 Cek Redaman</span></button>
                </form>
                <div id="resultCek" class="result"></div>
            </div>
            
            <div class="card card-aktivasi">
                <div class="card-icon">⚡</div>
                <h2>Aktivasi Pelanggan Isolir</h2>
                <form id="formAktivasi">
                    <div class="form-group">
                        <label>Pilih Server</label>
                        <select id="serverAktivasi" required><option value="">-- Pilih Server --</option></select>
                    </div>
                    <div class="form-group">
                        <label>Username Pelanggan</label>
                        <input type="text" id="usernameAktivasi" placeholder="Contoh: liacahyani" required>
                    </div>
                    <button type="submit" class="btn btn-secondary" id="btnAktivasi"><span>⚡ Aktivasi Sekarang</span></button>
                </form>
                <div id="resultAktivasi" class="result"></div>
            </div>
        </div>
    </div>
    
    <script>
        let queueCheckInterval;
        
        async function loadServers() {
            try {
                const res = await fetch('/api/servers');
                const data = await res.json();
                const selectCek = document.getElementById('serverCek');
                const selectAktivasi = document.getElementById('serverAktivasi');
                data.servers.forEach(server => {
                    selectCek.add(new Option(server.label, server.key));
                    selectAktivasi.add(new Option(server.label, server.key));
                });
            } catch (err) { console.error('Gagal load servers:', err); }
        }
        
        function showQueueNotification(position) {
            const existing = document.querySelector('.queue-notification');
            if (existing) existing.remove();
            const notification = document.createElement('div');
            notification.className = 'queue-notification';
            notification.innerHTML = `<h4>⏳ Anda Sedang Antrian</h4><p>Posisi antrian Anda: <strong>#${position}</strong><br>Mohon tunggu, permintaan akan diproses secara berurutan.</p>`;
            document.body.appendChild(notification);
            setTimeout(() => { notification.style.animation = 'slideOutRight 0.5s ease'; setTimeout(() => notification.remove(), 500); }, 5000);
        }
        
        document.getElementById('formCek').addEventListener('submit', async (e) => {
            e.preventDefault();
            const serverKey = document.getElementById('serverCek').value;
            const username = document.getElementById('usernameCek').value.trim();
            const btn = document.getElementById('btnCek');
            const resultDiv = document.getElementById('resultCek');
            
            btn.disabled = true;
            btn.innerHTML = '<div class="loading"></div> <span>Memproses...</span>';
            resultDiv.classList.remove('show');
            
            try {
                const res = await fetch('/api/cek-redaman', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ serverKey, username })
                });
                const data = await res.json();
                
                if (data.queued) {
                    showQueueNotification(data.position);
                    btn.innerHTML = '<span>⏳ Dalam Antrian</span>';
                    queueCheckInterval = setInterval(async () => {
                        try {
                            const queueRes = await fetch('/api/queue-status');
                            const queueData = await queueRes.json();
                            if (!queueData.isProcessing || queueData.queueLength === 0) {
                                clearInterval(queueCheckInterval);
                                btn.innerHTML = '<span>🔍 Cek Redaman</span>';
                                btn.disabled = false;
                            }
                        } catch (err) { clearInterval(queueCheckInterval); }
                    }, 3000);
                    return;
                }
                
                if (data.success) {
                    resultDiv.className = 'result show success';
                    resultDiv.innerHTML = `
                        <h3>📊 Hasil Cek Redaman OLT</h3>
                        <div class="result-item"><span class="result-label">👤 Pelanggan:</span><span class="result-value">${data.data.username}</span></div>
                        <div class="result-item"><span class="result-label">💻 Server:</span><span class="result-value">${data.data.server}</span></div>
                        <div class="result-item"><span class="result-label">🔒 MAC:</span><span class="result-value"><code>${data.data.mac}</code></span></div>
                        <div class="olt-result"><h4>${data.data.olt}</h4></div>
                    `;
                } else {
                    throw new Error(data.error || 'Gagal cek redaman');
                }
            } catch (err) {
                resultDiv.className = 'result show error';
                resultDiv.innerHTML = `<h3>❌ Error</h3><p>${err.message}</p>`;
            } finally {
                if (!queueCheckInterval) { btn.disabled = false; btn.innerHTML = '<span>🔍 Cek Redaman</span>'; }
            }
        });
        
        document.getElementById('formAktivasi').addEventListener('submit', async (e) => {
            e.preventDefault();
            const serverKey = document.getElementById('serverAktivasi').value;
            const username = document.getElementById('usernameAktivasi').value.trim();
            const btn = document.getElementById('btnAktivasi');
            const resultDiv = document.getElementById('resultAktivasi');
            
            btn.disabled = true;
            btn.innerHTML = '<div class="loading"></div> <span>Memproses...</span>';
            resultDiv.classList.remove('show');
            
            try {
                const res = await fetch('/api/aktivasi', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ serverKey, username })
                });
                const data = await res.json();
                
                if (data.queued) {
                    showQueueNotification(data.position);
                    btn.innerHTML = '<span>⏳ Dalam Antrian</span>';
                    queueCheckInterval = setInterval(async () => {
                        try {
                            const queueRes = await fetch('/api/queue-status');
                            const queueData = await queueRes.json();
                            if (!queueData.isProcessing || queueData.queueLength === 0) {
                                clearInterval(queueCheckInterval);
                                btn.innerHTML = '<span>⚡ Aktivasi Sekarang</span>';
                                btn.disabled = false;
                            }
                        } catch (err) { clearInterval(queueCheckInterval); }
                    }, 3000);
                    return;
                }
                
                if (data.success) {
                    resultDiv.className = 'result show success';
                    let html = `
                        <h3>✨ Aktivasi Berhasil</h3>
                        <div class="result-item"><span class="result-label">✅ Status:</span><span class="result-value"><strong>${data.data.status}</strong></span></div>
                        <div class="result-item"><span class="result-label">👤 Pelanggan:</span><span class="result-value">${data.data.username}</span></div>
                        <div class="result-item"><span class="result-label">🛜 Paket:</span><span class="result-value">${data.data.paket}</span></div>
                        <div class="result-item"><span class="result-label">💻 Server:</span><span class="result-value">${data.data.server}</span></div>
                        <div class="result-item"><span class="result-label">🌐 IP:</span><span class="result-value">${data.data.ip}</span></div>
                        <div class="result-item"><span class="result-label">🔒 MAC:</span><span class="result-value"><code>${data.data.mac}</code></span></div>
                    `;
                    if (data.data.olt && data.data.olt !== 'ONU tidak ditemukan di OLT manapun') {
                        html += `<div class="olt-result"><h4>${data.data.olt}</h4></div>`;
                    }
                    resultDiv.innerHTML = html;
                } else {
                    throw new Error(data.error || 'Gagal aktivasi');
                }
            } catch (err) {
                resultDiv.className = 'result show error';
                resultDiv.innerHTML = `<h3>❌ Error</h3><p>${err.message}</p>`;
            } finally {
                if (!queueCheckInterval) { btn.disabled = false; btn.innerHTML = '<span>⚡ Aktivasi Sekarang</span>'; }
            }
        });
        
        loadServers();
    </script>
</body>
</html>
