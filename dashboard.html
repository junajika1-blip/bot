<!DOCTYPE html>
<html lang="su">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alat NOC - Sunda Version</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* TEMA DARK DASHBOARD ADMIN */
            --bg-body: #0d1117; 
            --bg-surface: #161b22; 
            --border-color: #30363d; 
            
            --text-main: #c9d1d9; 
            --text-muted: #8b949e;
            
            --accent-blue: #2f81f7; 
            --accent-orange: #f0883e; 
            --success-green: #3fb950;
            --danger-red: #da3633;
            
            --radius: 6px; 
            --transition: 0.2s ease-in-out; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); line-height: 1.5; padding: 15px; }
        .container { max-width: 600px; margin: 0 auto; }

        /* HEADER ANIMASI BERJALAN (MARQUEE MULUS) */
        .header { 
            padding-bottom: 15px; 
            border-bottom: 1px solid var(--border-color); 
            margin-bottom: 20px; 
        }
        
        .marquee-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            box-sizing: border-box;
        }

        .marquee-text {
            display: inline-block;
            font-size: 16px;
            font-weight: 600;
            color: var(--accent-blue);
            /* Ieu konci na ngarah asup ti luar layar katuhu lalaunan */
            padding-left: 100%; 
            animation: scrollMarquee 10s linear infinite;
        }

        @keyframes scrollMarquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        /* TABS */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; background: var(--bg-surface); border: 1px solid var(--border-color); color: var(--text-muted); border-radius: var(--radius); font-size: 14px; font-weight: 600; cursor: pointer; transition: var(--transition); }
        .tab-btn.active[data-tab="0"] { background: rgba(47, 129, 247, 0.1); color: var(--accent-blue); border-color: var(--accent-blue); }
        .tab-btn.active[data-tab="1"] { background: rgba(240, 136, 62, 0.1); color: var(--accent-orange); border-color: var(--accent-orange); }

        /* PANEL */
        .panel { display: none; }
        .panel.active { display: block; animation: fadeIn 0.2s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* FORM & INPUTS */
        .card { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text-main); }
        .form-control { width: 100%; padding: 10px 12px; background: var(--bg-body); border: 1px solid var(--border-color); color: #ffffff; border-radius: var(--radius); font-size: 14px; transition: var(--transition); }
        .form-control:focus { outline: none; border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(47, 129, 247, 0.2); }
        select.form-control { appearance: auto; cursor: pointer; }

        /* BUTTONS */
        .btn { width: 100%; padding: 12px; border: none; border-radius: var(--radius); font-size: 14px; font-weight: 600; color: #ffffff; cursor: pointer; transition: var(--transition); display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 5px; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-blue { background: var(--accent-blue); }
        .btn-orange { background: var(--accent-orange); }

        /* ==========================================
           TERMINAL SCANNER ANIMATION
        ========================================== */
        .scanner-box {
            display: none;
            background: #010409;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            margin-top: 20px;
            position: relative;
            overflow: hidden;
            padding: 15px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }
        .scanner-box.show { display: block; animation: expandScanner 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        
        @keyframes expandScanner { from { max-height: 0; opacity: 0; } to { max-height: 200px; opacity: 1; } }

        .scan-laser {
            position: absolute;
            top: 0; left: 0;
            height: 2px;
            width: 30%;
            background: var(--accent-blue);
            box-shadow: 0 0 10px var(--accent-blue), 0 0 20px var(--accent-blue);
            animation: scanRadar 1.5s ease-in-out infinite alternate;
        }
        .scan-laser.orange { background: var(--accent-orange); box-shadow: 0 0 10px var(--accent-orange), 0 0 20px var(--accent-orange); }
        
        @keyframes scanRadar { 0% { left: -10%; } 100% { left: 80%; } }

        .terminal-logs {
            font-family: 'Fira Code', monospace;
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.6;
            min-height: 80px;
        }
        .log-line { display: block; }
        .log-line.active { color: #ffffff; text-shadow: 0 0 5px rgba(255,255,255,0.5); }
        .log-cursor {
            display: inline-block; width: 6px; height: 12px; background: #ffffff;
            margin-left: 5px; vertical-align: middle; animation: blink 1s step-end infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        .log-queue { color: #d29922; font-weight: 600; }

        /* RESULTS DATA GRID */
        .result-box { margin-top: 20px; border-top: 1px dashed var(--border-color); padding-top: 20px; display: none; }
        .result-box.show { display: block; animation: fadeIn 0.3s; }
        
        .status-banner { padding: 10px; border-radius: var(--radius); font-weight: 600; font-size: 13px; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .status-success { background: rgba(35, 134, 54, 0.15); border: 1px solid var(--success-green); color: var(--success-green); }
        .status-error { background: rgba(218, 54, 51, 0.15); border: 1px solid var(--danger-red); color: #ff7b72; }

        .data-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 15px; }
        .data-item { background: rgba(255,255,255,0.02); border: 1px solid var(--border-color); padding: 10px; border-radius: var(--radius); }
        .data-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
        .data-value { font-family: 'Fira Code', monospace; font-size: 13px; color: #ffffff; word-break: break-all; }
        .value-green { color: var(--success-green); }
        .value-red { color: #ff7b72; }

    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER MARQUEE -->
        <div class="header">
            <div class="marquee-container">
                <div class="marquee-text">Parios Redaman & Aktivasi Isolir</div>
            </div>
        </div>

        <!-- TABS NAV -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="0">Parios Redaman</button>
            <button class="tab-btn" data-tab="1">Aktipkeun Isolir</button>
        </div>

        <!-- TAB 0: CEK REDAMAN -->
        <div class="panel active" id="panel0">
            <div class="card">
                <form id="formCek">
                    <div class="form-group">
                        <label class="form-label">Pilih Server OLT</label>
                        <select class="form-control" id="serverCek" required>
                            <option value="">-- Pilih Server --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Username Pelanggan</label>
                        <input type="text" class="form-control" id="usernameCek" placeholder="WAN" required autocomplete="off">
                    </div>
                    <button type="submit" class="btn btn-blue" id="btnCek">Scan</button>
                </form>

                <!-- TERMINAL SCANNER (CEK) -->
                <div class="scanner-box" id="scannerCek">
                    <div class="scan-laser"></div>
                    <div class="terminal-logs" id="logCek"></div>
                </div>
                
                <!-- HASIL -->
                <div id="resultCek" class="result-box"></div>
            </div>
        </div>

        <!-- TAB 1: AKTIVASI -->
        <div class="panel" id="panel1">
            <div class="card" style="border-color: rgba(240, 136, 62, 0.3);">
                <form id="formAktivasi">
                    <div class="form-group">
                        <label class="form-label">Pilih Server Mikrotik</label>
                        <select class="form-control" id="serverAktivasi" required>
                            <option value="">-- Pilih Server --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Username Pelanggan</label>
                        <input type="text" class="form-control" id="usernameAktivasi" placeholder="WAN" required autocomplete="off">
                    </div>
                    <button type="submit" class="btn btn-orange" id="btnAktivasi">Aktipkeun</button>
                </form>

                <!-- TERMINAL SCANNER (AKTIVASI) -->
                <div class="scanner-box" id="scannerAktivasi">
                    <div class="scan-laser orange"></div>
                    <div class="terminal-logs" id="logAktivasi"></div>
                </div>
                
                <!-- HASIL -->
                <div id="resultAktivasi" class="result-box"></div>
            </div>
        </div>
    </div>

    <script>
        // 1. TABS
        const tabBtns = document.querySelectorAll('.tab-btn');
        const panels = document.querySelectorAll('.panel');
        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const target = btn.getAttribute('data-tab');
                tabBtns.forEach(b => b.classList.remove('active'));
                panels.forEach(p => p.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(`panel${target}`).classList.add('active');
            });
        });

        // 2. LOAD SERVERS
        async function loadServers() {
            try {
                const res = await fetch('/api/servers');
                const data = await res.json();
                const selCek = document.getElementById('serverCek');
                const selAkt = document.getElementById('serverAktivasi');
                data.servers.forEach(srv => {
                    selCek.add(new Option(srv.label, srv.key));
                    selAkt.add(new Option(srv.label, srv.key));
                });
            } catch (err) {}
        }

        // 3. FUNGSI TERMINAL LOG ANIMATION (Basa Sunda)
        let logIntervals = {};
        
        const dummyLogsCek = [
            "Ngamimitian protokol koneksi...",
            "Mariksa sandi server...",
            "Nge-ping ka node OLT...",
            "Neang data interface ONU...",
            "Maca modul optik TX/RX...",
            "Ngitung data redaman...",
            "Nyiapkeun hasil..."
        ];

        const dummyLogsAkt = [
            "Nyambung ka Mikrotik API...",
            "Milarian profil PPPoE aktif...",
            "Mariksa address-list firewall...",
            "Mupus aturan isolir...",
            "Ngamimitian deui interface klien...",
            "Mastikeun koneksi jalan...",
            "Ngapihkeun aktivasi..."
        ];

        function startScanner(target, isAktivasi) {
            const scannerBox = document.getElementById(`scanner${target}`);
            const logBox = document.getElementById(`log${target}`);
            scannerBox.classList.add('show');
            logBox.innerHTML = '';
            
            const logsArray = isAktivasi ? dummyLogsAkt : dummyLogsCek;
            let step = 0;

            printLogLine(logBox, "> Nyambungkeun kana sistem aman...");

            logIntervals[target] = setInterval(() => {
                if (step < logsArray.length) {
                    printLogLine(logBox, `> ${logsArray[step]}`);
                    step++;
                }
            }, 800);
        }

        function printLogLine(container, text, isQueue = false) {
            const prevLines = container.querySelectorAll('.log-line');
            prevLines.forEach(line => {
                line.classList.remove('active');
                const cursor = line.querySelector('.log-cursor');
                if(cursor) cursor.remove();
            });

            if(prevLines.length > 3) {
                prevLines[0].remove();
            }

            const div = document.createElement('div');
            div.className = `log-line active ${isQueue ? 'log-queue' : ''}`;
            div.innerHTML = `${text}<span class="log-cursor"></span>`;
            container.appendChild(div);
        }

        function setQueueLog(target, position, wait) {
            const logBox = document.getElementById(`log${target}`);
            printLogLine(logBox, `[SISTEM SIBUK] Ngantri di posisi #${position}... Antos ${wait} detik`, true);
        }

        function stopScanner(target) {
            if (logIntervals[target]) clearInterval(logIntervals[target]);
            document.getElementById(`scanner${target}`).classList.remove('show');
        }

        // 4. OLT PARSER & BUILDER (Basa Sunda)
        function parseOLTResult(oltText) {
            if(!oltText) return { oltName: 'Teu Kanyahoan', redaman: 'N/A', status: 'Teu Kanyahoan' };
            const lines = oltText.split('\n').filter(line => line.trim());
            const oltName = lines[0]?.replace(/[✅*]/g, '').trim() || 'OLT';
            const redaman = lines[1]?.match(/Redaman:\s*\*?([^\*]*)\*?/)?.[1].trim() || 'N/A';
            const status = lines[2]?.match(/Status:\s*(.*)/)?.[1].trim() || 'Teu Kanyahoan';
            return { oltName, redaman, status };
        }

        function buildDashboardResult(data, isAktivasi) {
            let html = '';
            html += `<div class="status-banner status-success">Rengse ✓</div>`;

            html += `<div class="data-grid">`;
            html += `<div class="data-item"><div class="data-label">USERNAME</div><div class="data-value">${data.username || '-'}</div></div>`;
            html += `<div class="data-item"><div class="data-label">SERVER</div><div class="data-value">${data.server || '-'}</div></div>`;
            if(data.ip) html += `<div class="data-item"><div class="data-label">IP ADDRESS</div><div class="data-value">${data.ip}</div></div>`;
            if(data.mac) html += `<div class="data-item"><div class="data-label">MAC ADDRESS</div><div class="data-value">${data.mac}</div></div>`;
            if(data.paket) html += `<div class="data-item"><div class="data-label">PROFIL / PAKET</div><div class="data-value">${data.paket}</div></div>`;

            if (data.olt && data.olt !== 'ONU tidak ditemukan di OLT manapun') {
                const olt = parseOLTResult(data.olt);
                let rxColor = (olt.redaman.includes('-') && parseFloat(olt.redaman) < -25) ? 'value-red' : 'value-green';
                html += `<div class="data-item" style="grid-column: 1 / -1;"><div class="data-label">Ngaran OLT</div><div class="data-value">${olt.oltName}</div></div>`;
                html += `<div class="data-item"><div class="data-label">REDAMAN (RX)</div><div class="data-value ${rxColor}">${olt.redaman}</div></div>`;
                html += `<div class="data-item"><div class="data-label">STATUS ONU</div><div class="data-value">${olt.status}</div></div>`;
            } else if (data.olt) {
                html += `<div class="data-item" style="grid-column: 1 / -1; border-color:var(--danger-red);"><div class="data-label">STATUS OLT</div><div class="data-value value-red">ONU Teu Kapendak</div></div>`;
            }
            html += `</div>`;
            return html;
        }

        function renderError(targetDiv, errMsg) {
            targetDiv.innerHTML = `<div class="status-banner status-error">✗ [GAGAL] ${errMsg}</div>`;
            targetDiv.classList.add('show');
        }

        // 5. CORE PROCESS
        let queuePollingInterval;

        async function processScan(action, serverKey, username) {
            const isAktivasi = action === 'aktivasi';
            const targetName = isAktivasi ? 'Aktivasi' : 'Cek';
            const resultDiv = document.getElementById(`result${targetName}`);
            const btn = document.getElementById(`btn${targetName}`);
            const endpoint = isAktivasi ? '/api/aktivasi' : '/api/cek-redaman';

            resultDiv.classList.remove('show');
            resultDiv.innerHTML = '';
            btn.disabled = true;
            btn.innerHTML = 'Nuju Proses...';
            
            startScanner(targetName, isAktivasi);

            try {
                const res = await fetch(endpoint, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ serverKey, username }) 
                });
                const data = await res.json();
                
                if (data.queued) {
                    setQueueLog(targetName, data.position, data.estimatedWait);
                    pollForResult(data.queueId, targetName, resultDiv, isAktivasi, btn);
                    return;
                }
                
                stopScanner(targetName);
                btn.disabled = false;
                btn.innerHTML = isAktivasi ? 'Aktipkeun' : 'Scan';
                
                if (data.success) {
                    resultDiv.innerHTML = buildDashboardResult(data.data, isAktivasi);
                    resultDiv.classList.add('show');
                } else {
                    renderError(resultDiv, data.error || 'Proses gagal dilaksanakeun.');
                }
            } catch (err) {
                stopScanner(targetName);
                btn.disabled = false;
                btn.innerHTML = isAktivasi ? 'Aktipkeun' : 'Scan';
                renderError(resultDiv, err.message);
            }
        }

        // 6. POLLING
        async function pollForResult(queueId, targetName, resultDiv, isAktivasi, btn) {
            queuePollingInterval = setInterval(async () => {
                try {
                    const res = await fetch(`/api/queue-result/${queueId}`);
                    const data = await res.json();
                    
                    if (data.status === 'done') {
                        clearInterval(queuePollingInterval); queuePollingInterval = null; 
                        stopScanner(targetName);
                        btn.disabled = false;
                        btn.innerHTML = isAktivasi ? 'Aktipkeun' : 'Scan';
                        
                        resultDiv.innerHTML = buildDashboardResult(data.data, isAktivasi);
                        resultDiv.classList.add('show');
                        
                    } else if (data.status === 'error') {
                        clearInterval(queuePollingInterval); queuePollingInterval = null; 
                        stopScanner(targetName);
                        btn.disabled = false;
                        btn.innerHTML = isAktivasi ? 'Aktipkeun' : 'Scan';
                        
                        renderError(resultDiv, data.error);
                    }
                } catch (err) {}
            }, 2000);
        }

        // 7. TRIGGERS
        document.getElementById('formCek').addEventListener('submit', async (e) => {
            e.preventDefault();
            await processScan('cek', document.getElementById('serverCek').value, document.getElementById('usernameCek').value.trim());
        });

        document.getElementById('formAktivasi').addEventListener('submit', async (e) => {
            e.preventDefault();
            await processScan('aktivasi', document.getElementById('serverAktivasi').value, document.getElementById('usernameAktivasi').value.trim());
        });

        loadServers();
    </script>
</body>
</html>
